# Reusable: publish a pre-built static site to S3 + invalidate CloudFront.
# The caller job builds the site (env vars are baked at build time — see
# docs/frontend-build-matrix.md), uploads the output as an artifact, then:
#
#   publish:
#     needs: build
#     uses: humanity-org/devops/.github/workflows/reusable-static-publish.yml@main
#     with:
#       artifact-name: site
#       bucket-name: humanity-safe-staging-ui
#       distribution-id: E123ABC
#     permissions:
#       id-token: write

name: reusable-static-publish

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        required: true
        type: string
      bucket-name:
        description: "Target S3 bucket (terraform output of the safe/swap stack)"
        required: true
        type: string
      distribution-id:
        description: "CloudFront distribution ID to invalidate"
        required: true
        type: string
      aws-region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: site

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Org-level variable, provisioned by terraform/cicd (static_publish_role_arn output).
          role-to-assume: ${{ github.ref_name == 'production' && vars.STATIC_PUBLISH_ROLE_ARN_PRODUCTION || vars.STATIC_PUBLISH_ROLE_ARN_STAGING }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync to S3
        # Immutable-deploy cache strategy. Content-hashed build assets
        # (/_next/static/*) get a 1-year immutable cache; everything else (HTML,
        # sw.js, manifests, public assets) gets no-cache so browsers revalidate
        # every load and pick up a new deploy immediately (the CloudFront edge is
        # flushed by the invalidation below). Without an explicit Cache-Control,
        # S3 sets none and browsers heuristically cache stale HTML long after a
        # deploy — which serves an old app/router until users manually clear.
        run: |
          # 1) Everything (removes orphans) as no-cache
          aws s3 sync site "s3://${{ inputs.bucket-name }}" --delete \
            --cache-control "no-cache"
          # 2) Force-overwrite content-hashed assets as long-lived immutable.
          #    Use cp (not sync): step 1 already uploaded the identical bytes, so
          #    a second sync would skip them and never update the Cache-Control.
          #    cp always re-writes. Guarded for non-Next.js consumers.
          if [ -d site/_next/static ]; then
            aws s3 cp "site/_next/static" "s3://${{ inputs.bucket-name }}/_next/static" \
              --recursive --cache-control "public, max-age=31536000, immutable"
          fi

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ inputs.distribution-id }}" --paths '/*'
